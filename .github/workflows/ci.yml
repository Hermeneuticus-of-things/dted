# Testarea automată a D&TED la fiecare push și pull request.
#
# Programul e făcut pentru Windows (criptarea folosește bcrypt.dll din Windows),
# dar nucleul (motor, documente, actualizări, parolă) rulează și pe Linux,
# unde testele de criptare se sar singure (vezi teste/test_criptare.py).

name: Testare

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  testare:
    name: Teste ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Biblioteci de sistem (doar Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libportaudio2 libegl1 libgl1 libxkbcommon0 libglib2.0-0t64 libdbus-1-3 libfontconfig1

      - name: Instalează dependențele
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Verifică documentația și contractul de release
        run: python scripts/check_release_contract.py

      - name: Rulează testele
        run: pytest teste -q
