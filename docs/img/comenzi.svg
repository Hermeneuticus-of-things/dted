<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="100%" role="img" aria-label="Comenzi vocale: vocea devine text punctuat — punct, virgulă, paragraf nou, ghilimele, paranteze, linie de dialog">
  <title>Comenzi vocale — vorbești, programul scrie semnele</title>
  <defs>
    <linearGradient id="fundal2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#12203a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="260" rx="18" fill="url(#fundal2)"/>
  <rect x="1.5" y="1.5" width="1197" height="257" rx="17" fill="none" stroke="#26364f" stroke-width="1.5"/>

  <text x="60" y="66" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#f1f5f9">Comenzi vocale — rostești, programul scrie semnele</text>

  <!-- comanda rostită -->
  <g font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="20">
    <rect x="60" y="100" width="470" height="44" rx="10" fill="#1d3050"/>
    <text x="78" y="128" fill="#9fb2cc">🎙 „am ajuns punct deschide ghilimele bravo”</text>

    <!-- săgeata -->
    <path d="M560 122 h60 l-12 -10 m12 10 l-12 10" stroke="#e0b35c" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- rezultatul -->
    <rect x="650" y="100" width="490" height="44" rx="10" fill="#152642"/>
    <text x="668" y="128" fill="#f1f5f9">Am ajuns. „Bravo</text>
  </g>

  <!-- grile de comenzi -->
  <g font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="18" fill="#cdd9ea">
    <g>
      <text x="60" y="186" fill="#e0b35c" font-weight="700">Punctuație</text>
      <text x="60" y="216">„punct” · „virgulă” · „două puncte”</text>
      <text x="60" y="242">„punct și virgulă” · „semn de întrebare”</text>
    </g>
    <g>
      <text x="470" y="186" fill="#e0b35c" font-weight="700">Structură și ghilimele</text>
      <text x="470" y="216">„paragraf nou” · „rând nou”</text>
      <text x="470" y="242">„deschide/închide ghilimele”</text>
    </g>
    <g>
      <text x="800" y="186" fill="#e0b35c" font-weight="700">Linii și simboluri</text>
      <text x="800" y="216">„linie de dialog” · „cratimă”</text>
      <text x="800" y="242">„procent” · „slash” · „ampersand”</text>
    </g>
  </g>
</svg>
